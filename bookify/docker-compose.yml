services:
  bookify:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_PATH: /data/bookify.sqlite
      STATIC_ROOT: /app/dist
      COOKIE_SECURE: "true"
    volumes:
      - bookify_data:/data
    networks:
      - cloudflare

volumes:
  bookify_data:

networks:
  cloudflare:
    external: true

